name: Backend CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build and test with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./gradlew build --no-daemon

  publish:
    name: Publish image to ECR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_URI: 015454941458.dkr.ecr.ap-northeast-2.amazonaws.com/ieee-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build Docker image
        shell: bash
        run: |
          if [[ ! -f Dockerfile ]]; then
            echo '::error::Dockerfile is missing. Merge the Docker setup from issue #7 before publishing.'
            exit 1
          fi
          docker build --platform linux/amd64 --tag "$IMAGE_URI:$GITHUB_SHA" .

      - name: Assume AWS role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::015454941458:role/IEEE-github-actions-ecr-role
          aws-region: ap-northeast-2
          allowed-account-ids: '015454941458'

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image to Amazon ECR
        run: docker push "$IMAGE_URI:$GITHUB_SHA"
