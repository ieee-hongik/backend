name: Deploy backend to EC2

on:
  workflow_call:

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: ieee-backend-ec2-i-0753e06df7c912786
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: i-0753e06df7c912786
      AWS_CLI_ERROR_FORMAT: legacy
      AWS_MAX_ATTEMPTS: '2'

    steps:
      - name: Assume AWS role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::015454941458:role/IEEE-github-actions-ecr-role
          aws-region: ap-northeast-2
          allowed-account-ids: '015454941458'

      - name: Send deployment command and wait for its result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Expected one full commit SHA.'
            exit 1
          fi

          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ $main_sha != "$GITHUB_SHA" ]]; then
            echo '::notice::This commit is no longer the head of main. Skipping deployment.'
            exit 0
          fi

          command_id=$(AWS_MAX_ATTEMPTS=1 aws ssm send-command \
            --document-name IEEE-DeployBackend \
            --document-version 1 \
            --instance-ids "$INSTANCE_ID" \
            --parameters "CommitSha=$GITHUB_SHA" \
            --timeout-seconds 600 \
            --cli-connect-timeout 5 --cli-read-timeout 30 \
            --query 'Command.CommandId' --output text --no-cli-pager)
          if [[ ! $command_id =~ ^[0-9a-f-]{36}$ ]]; then
            echo '::error::SSM did not return a valid command ID.'
            exit 1
          fi
          echo "SSM command ID: $command_id"

          deadline=$((SECONDS + 1920))
          while (( SECONDS < deadline )); do
            if result=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --plugin-name DeployBackend \
              --cli-connect-timeout 5 --cli-read-timeout 10 \
              --query '[Status, ResponseCode]' --output text --no-cli-pager 2>&1); then
              read -r status response_code <<< "$result"
              case "$status:$response_code" in
                Success:0) echo 'EC2 deployment succeeded.'; exit 0 ;;
                Pending:*|InProgress:*|Delayed:*|Cancelling:*) ;;
                *)
                  printf '::error::SSM deployment ended with status %s and exit code %s. See command %s in Systems Manager.\n' \
                    "$status" "$response_code" "$command_id"
                  exit 1
                  ;;
              esac
            elif [[ $result != 'An error occurred (InvocationDoesNotExist) when calling the GetCommandInvocation operation:'* ]]; then
              echo "::error::Could not query SSM command $command_id. Check its result in Systems Manager."
              exit 1
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for SSM command $command_id. Check its result in Systems Manager."
          exit 1
