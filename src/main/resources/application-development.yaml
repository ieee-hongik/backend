spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${DB_PORT:3306}/ieee_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Flyway 도입 전 임시 설정. JPA가 classpath에 있을 때만 적용된다.
  jpa:
    hibernate:
      ddl-auto: update

  # schema.sql, data.sql이 없으면 초기화는 건너뛴다. 기본 경로는 optional:classpath* 이다.
  sql:
    init:
      mode: always
